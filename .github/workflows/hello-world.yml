# Meta data du workflow
name: Hello World
# Événement Déclancher
on:
    push:
# Travaille a effectué

jobs:
    hello:
        runs-on: windows
        steps:
                        # Récupérer le code
            - uses: actions/checkout@v7
            # Installer un environnement Node.js
            - uses: actions/setup-node@v7
              with:
                node-version: 25.3.0
            - uses: actions/cache@v5
              with:
                path: ~/.npm
                key: npm-${{ hashFiles('package-lock.json') }}
            - run: echo "Hello World"